[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-expansion-h3"
version = "1.0.0"
description = "Modelo de expansión para retail farmacéutico por hexágonos H3 (datos sintéticos)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "h3>=4.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
